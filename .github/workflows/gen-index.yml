name: gen-reports-index

# Regenerate reports.json (the homepage index) whenever a report lands.
# index.html fetches reports.json same-origin, so no browser-side GitHub API
# calls are needed. The bot commit touches ONLY reports.json, which is not in
# the push paths above, so it does not re-trigger this workflow (no loop).

on:
  push:
    branches: [main]
    paths:
      - "stock-report-*.html"
      - ".github/scripts/gen_index.py"
      - ".github/workflows/gen-index.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1"   # weekly safety net

permissions:
  contents: write

concurrency:
  group: gen-reports-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate reports.json
        run: python3 .github/scripts/gen_index.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41888575@githubusers.com"
          git add reports.json
          if git diff --staged --quiet; then
            echo "reports.json unchanged — nothing to commit"
          else
            git commit -m "chore: regenerate reports.json index"
            git push
          fi
